name: PoC tests

on:
  push:
    branches:
      - feature/emulator-poc
      - feature/bluestacks-poc
      - feature/native-arm64-emulator
      - feature/unified-android-backend
      - feature/tugarin-bots-v1-hardening
  pull_request:
    branches:
      - feature/emulator-poc
      - main
      - feature/native-arm64-emulator
      - feature/unified-android-backend

jobs:
  windows-poc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile application modules
        run: python -m py_compile emulator_poc.py bluestacks_poc.py native_arm64_poc.py device_backend.py frame_stream.py runtime_events.py runtime_recovery.py runtime_watchdog.py warbot_cli.py bot.py gui.py
      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw install_tugarin_bots.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/install_wsa_poc.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/verify_mvp.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/audit_runtime_processes.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/verify_release.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/run_and_report.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/upload_runtime_report.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw scripts/setup_dedicated_wsa_user.ps1)) | Out-Null
      - name: Run application unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
