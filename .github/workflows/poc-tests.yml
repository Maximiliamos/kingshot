name: PoC tests

on:
  push:
    branches:
      - feature/emulator-poc
      - feature/bluestacks-poc
      - feature/native-arm64-emulator
      - feature/unified-android-backend
      - feature/unified-android-backend
  pull_request:
    branches:
      - feature/emulator-poc
      - main
      - feature/native-arm64-emulator

jobs:
  windows-poc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application modules
        run: python -m py_compile emulator_poc.py bluestacks_poc.py native_arm64_poc.py device_backend.py bot.py gui.py
      - name: Run application unit tests
        run: python -m unittest discover -s tests -v
